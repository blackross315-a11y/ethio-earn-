<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethio Earn</title>
    <style>
        :root {
            --bg-color: #0a110d;
            --card-bg: #112219;
            --accent-green: #00cc66;
            --text-color: #ffffff;
            --text-muted: #889990;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding-bottom: 70px; }
        
        /* Header */
        .header { padding: 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1a2e22; }
        .logo { font-weight: bold; font-size: 1.2rem; color: var(--text-color); }
        .lang-badge { background: #1a2e22; padding: 5px 10px; border-radius: 15px; font-size: 0.8rem; color: var(--accent-green); }

        /* Navigation Bottom Bar */
        .nav-bar { position: fixed; bottom: 0; left: 0; right: 0; background: #0d1a13; display: flex; justify-content: space-around; padding: 10px 0; border-top: 1px solid #1a2e22; z-index: 1000; }
        .nav-item { background: none; border: none; color: var(--text-muted); display: flex; flex-direction: column; align-items: center; font-size: 0.8rem; cursor: pointer; width: 20%; }
        .nav-item.active { color: var(--accent-green); }
        .nav-item svg { width: 24px; height: 24px; margin-bottom: 4px; fill: currentColor; }

        /* Pages */
        .page { display: none; padding: 20px; }
        .page.active { display: block; }

        /* Cards & UI Elements */
        .card { background: var(--card-bg); border-radius: 15px; padding: 20px; margin-bottom: 15px; border: 1px solid #1a3324; }
        .welcome-card { background: linear-gradient(135deg, #0b2b1a, #112219); border: 1px solid var(--accent-green); }
        .points-title { font-size: 2rem; font-weight: bold; color: var(--accent-green); margin: 10px 0; }
        .stats-grid { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-box { flex: 1; background: var(--card-bg); padding: 15px; border-radius: 12px; border: 1px solid #1a3324; }
        .stat-val { font-size: 1.5rem; font-weight: bold; margin-top: 5px; }

        /* Grid */
        .grid { display: flex; gap: 15px; margin-top: 15px; }
        .grid-item { flex: 1; background: var(--card-bg); padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #1a3324; cursor: pointer; }
        .grid-item:hover { border-color: var(--accent-green); }
        .grid-icon { font-size: 2.5rem; margin-bottom: 10px; }

        /* Buttons */
        .btn { background: var(--accent-green); color: #000; border: none; padding: 12px; border-radius: 8px; width: 100%; font-weight: bold; cursor: pointer; font-size: 1rem; margin-top: 10px; }
        .btn-tg { background: #0088cc; color: #fff; }

        /* Inputs */
        input, select { width: 100%; padding: 12px; background: #0d1a13; border: 1px solid #1a3324; border-radius: 8px; color: #fff; margin-top: 8px; margin-bottom: 15px; font-size: 1rem; }
    </style>i
