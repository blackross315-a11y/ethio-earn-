<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethio Earn</title>
    <style>
        /* 1. መሠረታዊ የገጽታ ቀለማት (Theme Setup) */
        :root {
            --bg-color: #0b1a13;
            --card-bg: #132a1e;
            --primary-green: #00e676;
            --text-main: #ffffff;
            --text-muted: #a0aec0;
            --accent-gold: #ffd700;
        }

        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            margin: 0; 
            padding: 0; 
            padding-bottom: 80px;
        }

        /* 2. የራስጌ ክፍል (Header Area) */
        header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo-area h1 {
            color: var(--primary-green);
            margin: 0;
            font-size: 24px;
            letter-spacing: 1px;
        }

        .logo-area p {
            color: var(--text-muted);
            margin: 5px 0 0 0;
            font-size: 11px;
            text-transform: uppercase;
        }

        .notification-icon {
            font-size: 24px;
            color: var(--accent-gold);
            cursor: pointer;
            position: relative;
        }

        /* 3. የገጾች መዋቅር (Pages) */
        .page { display: none; padding: 0 20px; }
        .page.active { display: block; }

        /* 4. የካርድ ዲዛይኖች (Card Blocks) */
        .card { 
            background-color: var(--card-bg); 
            padding: 20px; 
            margin-bottom: 15px; 
            border-radius: 16px; 
            border: 1px solid rgba(255,255,255,0.05);
        }

        .welcome-card {
            background: linear-gradient(135deg, #132a1e 0%, #084d2c 100%);
            border: 1px solid rgba(0, 230, 118, 0.2);
        }

        .card h3 { margin-top: 0; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        .card p { color: var(--text-muted); font-size: 14px; line-height: 1.5; }

        /* ባለሁለት አምድ መዋቅር (Grid for Points & Referrals) */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .dash-card {
            background-color: var(--card-bg);
            padding: 15px;
            border-radius: 16px;
        }

        .dash-card .label {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
        }

        .dash-card .value {
            font-size: 28px;
            font-weight: bold;
            margin-top: 8px;
        }

        /* 5. የጨረታ ዕቃዎች ግሪድ (Auctions Grid) */
        .section-title {
            font-size: 20px;
            margin: 25px 0 15px 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .auction-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .product-card {
            background-color: var(--card-bg);
            border-radius: 16px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.02);
            cursor: pointer;
        }

        .product-icon {
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 15px;
        }

        .product-card h4 { margin: 0 0 8px 0; font-size: 16px; text-align: left; }
        .product-card p { margin: 0; font-size: 12px; text-align: left; color: var(--primary-green); font-weight: 500; }

        /* 6. ቁልፎች (Buttons) */
        button { 
            width: 100%;
            padding: 12px; 
            border: none; 
            border-radius: 12px; 
            cursor: pointer; 
            font-weight: bold;
            font-size: 14px;
            transition: background 0.2s;
        }
        button.primary { background-color: var(--primary-green); color: #0b1a13; }
        button.primary:hover { background-color: #00c864; }
        button.secondary { background-color: rgba(255,255,255,0.08); color: var(--text-main); }

        /* 7. የበታች ማውጫ (Navigation Bar) */
        nav { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            background-color: #07120d; 
            display: flex; 
            justify-content: space-around; 
            padding: 12px 0; 
            border-top: 1px solid rgba(255,255,255,0.05); 
            box-shadow: 0 -4px 10px rgba(0,0,0,0.3);
        }
        nav button { 
            background: none; 
            color: var(--text-muted); 
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            width: auto;
            font-weight: 500;
        }
        nav button.selected { 
            color: var(--primary-green); 
        }

        /* የቋንቋ መቀያየሪያ ስታይል */
        .lang-container {
            padding: 0 20px;
            text-align: right;
            margin-bottom: 10px;
        }
        .lang-btn {
            background: rgba(255,255,255,0.05);
            color: var(--text-main);
            border: 1px solid rgba(255,255,255,0.1);
            padding: 6px 12px;
            border-radius: 20px;
            width: auto;
            font-size: 12px;
        }
    </style>
</head>
<body>

<header>
    <div class="logo-area">
        <h1 id="mainTitle">ETHIO EARN</h1>
        <p id="subtitle">EARN MORE · WIN MORE</p>
    </div>
    <div class="notification-icon">🔔</div>
</header>

<div class="lang-container">
    <button class="lang-btn" onclick="changeLang()" id="langBtn">English</button>
</div>

<main>
    <!-- HOME PAGE -->
    <section id="home" class="page active">
        <div class="card welcome-card">
            <h3 id="welcome">🎁 WELCOME BONUS</h3>
            <div class="big-value" style="font-size: 32px; font-weight: 900; margin: 10px 0;">100 POINTS</div>
            <p id="welcomeDesc" style="margin: 0;">Welcome to your electronics rewards community</p>
        </div>

        <div class="dashboard-grid">
            <div class="dash-card">
                <div class="label" id="pointsLabel">🪙 MY POINTS</div>
                <div class="value" id="homePoints">100</div>
            </div>
            <div class="dash-card">
                <div class="label" id="refLabel">👥 REFERRALS</div>
                <div class="value">0</div>
            </div>
        </div>

        <h3 class="section-title" id="auctionTitle">🔥 Electronics auctions</h3>
        
        <div class="auction-grid">
            <!-- Smartphone Card -->
            <div class="product-card" onclick="openPage('auction', document.getElementById('navAuction'))">
                <div class="product-icon">
                    <!-- SVG ለስማርትፎን አይኮን -->
                    <svg width="40" height="70" viewBox="0 0 40 70" fill="none" xmlns="http://w3.org">
                        <rect x="2" y="2" width="36" height="66" rx="6" stroke="#a0aec0" stroke-width="3"/>
                        <rect x="6" y="8" width="28" height="46" rx="2" fill="#a0aec0" opacity="0.2"/>
                        <circle cx="20" cy="60" r="3" fill="#a0aec0"/>
                        <rect x="14" y="6" width="12" height="2" rx="1" fill="#a0aec0"/>
                        <!-- ማያ ገጽ ላይ ያሉ ትናንሽ ሳጥኖች -->
                        <rect x="9" y="12" width="6" height="6" rx="1" fill="#ff4d4d"/>
                        <rect x="17" y="12" width="6" height="6" rx="1" fill="#00e676"/>
                        <rect x="25" y="12" width="6" height="6" rx="1" fill="#29b6f6"/>
                        <rect x="9" y="22" width="6" height="6" rx="1" fill="#ffd700"/>
                        <rect x="17" y="22" width="6" height="6" rx="1" fill="#ba68c8"/>
                        <rect x="25" y="22" width="6" height="6" rx="1" fill="#ffffff"/>
                    </svg>
                </div>
                <h4 id="prod1">Smartphones</h4>
                <p id="startPrice1">Starting bid: 70 ETB</p>
            </div>

            <!-- Laptop Card -->
            <div class="product-card" onclick="openPage('auction', document.getElementById('navAuction'))">
                <div class="product-icon">
                    <!-- SVG ለላፕቶፕ አይኮን -->
                    <svg width="80" height="50" viewBox="0 0 80 50" fill="none" xmlns="http://w3.org">
                        <rect x="15" y="5" width="50" height="34" rx="4" stroke="#ffffff" stroke-width="3"/>
                        <rect x="19" y="9" width="42" height="26" fill="#ffffff" opacity="0.1"/>
                        <path d="M5 42.5C5 40.567 6.567 39 8.5 39H71.5C73.433 39 75 40.567 75 42.5V45H5V42.5Z" fill="#ffffff"/>
                        <rect x="32" y="40" width="16" height="2" fill="#0b1a13"/>
                    </svg>
                </div>
                <h4 id="prod2">Laptops</h4>
                <p id="startPrice2">Starting bid: 70 ETB</p>
            </div>
        </div>
    </section>

    <!-- AUCTION DETAIL PAGE -->
    <section id="auction" class="page">
        <h2 id="auctionPage">🏆 Auctions</h2>
        <div class="card">
            <h3 id="phoneTitle">Smartphone Auction</h3>
            <p><span id="highestBidLabel">Highest demo bid:</span> <span id="highestBid" class="big" style="color:var(--primary-green)">70 ETB</span></p>
            <button class="primary" onclick="placeBid()" id="bidBtn">Place demo bid (-10 points)</button>
        </div>
    </section>

    <!-- TASKS PAGE -->
